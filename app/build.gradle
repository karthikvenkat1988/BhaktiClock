plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bhakticlock'
    compileSdk 35

    defaultConfig {
        applicationId "com.bhakticlock"
        minSdk 26          // Android 8.0 and newer
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's Material Design components: cards, clock-face time picker, chips, sliders, bottom sheets
    implementation 'com.google.android.material:material:1.12.0'
}
