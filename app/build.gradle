plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bhakticlock'
    compileSdk 35

    defaultConfig {
        applicationId "com.bhakticlock"
        minSdk 26          // Android 8.0 and newer
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the built-in Android framework.
