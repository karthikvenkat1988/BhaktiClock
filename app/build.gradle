plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bhakticlock'
    compileSdk 36

    defaultConfig {
        applicationId "com.karthikvenkat.bhakticlock"
        minSdk 26          // Android 8.0 and newer
        targetSdk 36   // Google Play requires Android 16 for new apps
        versionCode 3
        versionName "1.2"
    }

    // Release signing for Google Play. The key is never stored in the repository:
    // the GitHub build reads it from repository secrets (see store/PLAY_STORE_GUIDE.md).
    signingConfigs {
        release {
            def ks = System.getenv("BC_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("BC_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BC_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("BC_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("BC_KEYSTORE")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's Material Design components: cards, clock-face time picker, chips, sliders, bottom sheets
    implementation 'com.google.android.material:material:1.12.0'
}
